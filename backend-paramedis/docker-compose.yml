services:
  mysql:
    image: mysql:8
    container_name: mysql-main
    restart: always

    environment:
      MYSQL_DATABASE: db_hse_cctv_pim
      MYSQL_USER: cctv_app
      MYSQL_PASSWORD: CctvPIM@2026Secure
      MYSQL_ROOT_PASSWORD: RootMysqlSecure2026!

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - company-network

  # =====================
  # COMPANY PROFILE
  # =====================

  company-profile:
    build:
      context: ./company-profile

    container_name: company-profile

    restart: always

    expose:
      - '80'

    networks:
      - company-network

  # =====================
  # CCTV
  # =====================

  backend-cctv:
    build:
      context: ./backend-cctv

    container_name: backend-cctv

    restart: always

    expose:
      - '8081'

    depends_on:
      - mysql

    networks:
      - company-network

  frontend-cctv:
    build:
      context: ./frontend-cctv

    container_name: frontend-cctv

    restart: always

    expose:
      - '80'

    depends_on:
      - backend-cctv

    networks:
      - company-network

  # =====================
  # HSE
  # =====================

  backend-hse:
    build:
      context: ./backend-hse

    container_name: backend-hse

    restart: always

    expose:
      - '8082'

    depends_on:
      - mysql

    networks:
      - company-network

  frontend-hse:
    build:
      context: ./frontend-hse

    container_name: frontend-hse

    restart: always

    expose:
      - '80'

    depends_on:
      - backend-hse

    networks:
      - company-network

  # =====================
  # PARAMEDIS
  # =====================

  backend-paramedis:
    build:
      context: ./backend-paramedis

    container_name: backend-paramedis

    restart: always

    expose:
      - '8083'

    depends_on:
      - mysql

    networks:
      - company-network

  frontend-paramedis:
    build:
      context: ./frontend-paramedis

    container_name: frontend-paramedis

    restart: always

    expose:
      - '80'

    depends_on:
      - backend-paramedis

    networks:
      - company-network

  # =====================
  # MAIN NGINX
  # =====================

  nginx:
    image: nginx:alpine

    container_name: nginx-main

    restart: always

    ports:
      - '80:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - company-profile
      - frontend-cctv
      - frontend-hse
      - frontend-paramedis

    networks:
      - company-network

volumes:
  mysql_data:

networks:
  company-network:
    driver: bridge

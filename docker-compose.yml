services:
  mysql:
    image: mysql:8

    container_name: mysql-main

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      timeout: 20s
      retries: 10

    networks:
      - company-network

  backend-cctv:
    build:
      context: ./backend-cctv

    container_name: backend-cctv

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      JWT_SECRET: ${JWT_SECRET}

      DB_HOST: mysql

      DB_PORT: 3306

      DB_USER: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      DB_NAME: ${MYSQL_DATABASE}

    expose:
      - '8081'

    networks:
      - company-network

  company-profile:
    build:
      context: ./company-profile

    container_name: company-profile

    restart: always

    expose:
      - '80'

    networks:
      - company-network

  frontend-hse:
    build:
      context: ./frontend-hse

    container_name: frontend-hse

    restart: always

    expose:
      - '80'

    networks:
      - company-network

  frontend-cctv:
    build:
      context: ./frontend-cctv

    container_name: frontend-cctv

    restart: always

    expose:
      - '80'

    networks:
      - company-network

  frontend-paramedis:
    build:
      context: ./frontend-paramedis

    container_name: frontend-paramedis

    restart: always

    expose:
      - '80'

    networks:
      - company-network

  nginx:
    image: nginx:alpine

    container_name: nginx-main

    restart: always

    ports:
      - '80:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - company-profile
      - frontend-hse
      - frontend-cctv
      - frontend-paramedis
      - backend-cctv

    networks:
      - company-network

volumes:
  mysql_data:
    external: true
    name: backend_mysql_data

networks:
  company-network:
    driver: bridge
